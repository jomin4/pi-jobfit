# 스킬 사전 시드 — skills 테이블의 초기 데이터.
#
# name      : 표준명. skills.canonical_name (유일)
# category  : language | framework | database | cloud | tool | soft | domain
# aliases   : 같은 스킬의 다른 표기. 소문자 비교로 매칭한다
# patterns  : 별칭만으로 오탐을 못 막는 경우의 정규식 (R, C, Go 처럼 짧은 이름)
#
# 오탐 주의 대상에는 patterns 를 반드시 넣는다. 예) R&D 의 R, C 레벨 임원의 C

skills:
  # ---------------- language ----------------
  - {name: Python, category: language, aliases: [파이썬, python3, py]}
  - {name: Java, category: language, aliases: [자바]}
  - {name: JavaScript, category: language, aliases: [자바스크립트, js, ecmascript]}
  - {name: TypeScript, category: language, aliases: [타입스크립트, ts]}
  - {name: Go, category: language, aliases: [golang, 고랭], patterns: ['(?<![A-Za-z])[Gg]o(?:lang)?(?![A-Za-z])']}
  - {name: Kotlin, category: language, aliases: [코틀린]}
  - {name: Swift, category: language, aliases: [스위프트]}
  - {name: C, category: language, aliases: [], patterns: ['(?<![A-Za-z+#&])C(?![A-Za-z+#&])']}
  - {name: C++, category: language, aliases: [cpp, 씨쁠쁠]}
  - {name: C#, category: language, aliases: [csharp, 씨샵]}
