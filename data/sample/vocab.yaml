# 같은 회사가 소스마다 다르게 표기되는 상황을 재현한다 (name_normalized 테스트용)
company_name_forms:
  - "(주){base}"
  - "{base}(주)"
  - "{base} 주식회사"
  - "㈜{base}"
  - "{base}"

