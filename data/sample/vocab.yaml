# ---- 파싱 난이도를 만드는 원문 표기들 ----

salary_forms:
  - {kind: none, weight: 45, text: ["회사내규에 따름", "면접 후 결정", "협의 후 결정", "추후 협의"]}
  - {kind: range, weight: 40, text: ["연 {min}~{max}만원", "{min}만원 ~ {max}만원", "연봉 {min}-{max}"]}
  - {kind: single, weight: 15, text: ["연 {min}만원 이상", "{min}만원 이상", "월 {month}만원"]}

career_forms:
  - {code: "Z", weight: 15, text: ["경력무관", "경력 무관", "신입/경력"]}
  - {code: "N", weight: 18, text: ["신입", "신입 채용", "신입 (인턴 우대)"]}
  - {code: "E", weight: 67, text: ["경력 {min}년 이상", "{min}~{max}년", "경력 {months}개월 이상", "{min}년차 이상"]}

deadline_forms:
  - {kind: date, weight: 70, text: ["{y}-{m}-{d}", "{y}.{m}.{d}", "{y}/{m}/{d}"]}
  - {kind: open, weight: 30, text: ["상시채용", "채용시까지", "채용시 마감"]}

# 본문에 섞을 오염 (HTML 잔재, 과한 공백)
noise_snippets:
  - "<br>"
  - "&nbsp;"
  - "&amp;"
  - "\n\n\n"
  - "※"

# 추출기를 속이기 위한 함정. 여기 등장하는 스킬은 정답에 넣지 않는다.
trap_phrases:
  - "R&D 조직과 긴밀히 협업합니다"
  - "C 레벨 임원과의 커뮤니케이션 기회가 많습니다"
  - "Go 사업부 신설에 따른 충원입니다"
  - "Java 경험은 필수가 아닙니다"
  - "Python 경험 무관"
  - "R 부서 이관 예정"

jobcont_intro:
  - "{role} 포지션에서 서비스 전반의 개발을 담당합니다."
  - "{company}의 {role} 직무를 함께할 분을 찾습니다."
  - "성장 중인 {role} 조직에서 핵심 기능을 만들어갈 분을 모십니다."
  - "{role}로서 제품의 안정성과 확장성을 책임집니다."

jobcont_task:
  - "- {skill} 기반 기능 설계 및 구현"
  - "- {skill}을 활용한 서비스 개발 및 운영"
  - "- {skill} 환경에서의 성능 개선"
  - "- {skill} 도입 및 유지보수"
  - "- 신규 프로젝트에서 {skill} 적용"

require_line:
  - "- {skill} 실무 경험"
  - "- {skill} 활용 능력"
  - "- {skill}에 대한 이해"
  - "- {skill} 개발 경험 보유자"

prefer_line:
  - "- {skill} 사용 경험이 있으신 분"
  - "- {skill} 우대"
  - "- {skill} 경험자 우대합니다"
